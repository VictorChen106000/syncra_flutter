[project]
name = "syncra-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "firebase-admin>=6.5.0",
  "anthropic>=0.39.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = ["ruff>=0.7.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
