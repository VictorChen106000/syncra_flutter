<svg xmlns="http://www.w3.org/2000/svg" width="44" height="52" viewBox="0 0 44 52" fill="none">
  <!-- document body with a softly folded top-right corner -->
  <path d="M9 3 H28 L39 14 V44 Q39 49 34 49 H9 Q4 49 4 44 V8 Q4 3 9 3 Z" fill="#FFFFFF"/>
  <!-- the folded corner, showing its underside -->
  <path d="M28 3 V14 H39 Z" fill="#DCE1E6"/>
  <!-- two faint text lines, just enough to read as a document -->
  <rect x="11" y="20" width="18" height="2.6" rx="1.3" fill="#E7EBEF"/>
  <rect x="11" y="25.5" width="13" height="2.6" rx="1.3" fill="#E7EBEF"/>
  <!-- the recognizable red PDF badge -->
  <rect x="9" y="31" width="24" height="12" rx="3" fill="#FF5C5C"/>
  <text x="21" y="40" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">PDF</text>
</svg>
